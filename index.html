<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>阿瑟同款 · 呼吸爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            background: transparent;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const size = Math.min(w, h) * 0.92;
            canvas.width = size;
            canvas.height = size;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            return size;
        }

        let CANVAS_SIZE = resizeCanvas();
        let CX = CANVAS_SIZE / 2;
        let CY = CANVAS_SIZE / 2;

        const HEART_COLOR = '#FF69B4';
        const HEART_COLOR_LIGHT = '#FFB6C1';
        const GENERATE_FRAME = 60;

        function getScale() {
            return CANVAS_SIZE / 780;
        }

        function heartFunction(t) {
            const scale = getScale() * 14;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: Math.round(x * scale + CX),
                y: Math.round(y * scale + CY)
            };
        }

        function scatterInside(x, y, beta = 0.15) {
            const ratioX = -beta * Math.log(Math.random());
            const ratioY = -beta * Math.log(Math.random());
            const dx = ratioX * (x - CX);
            const dy = ratioY * (y - CY);
            return { x: Math.round(x - dx), y: Math.round(y - dy) };
        }

        function curve(p) {
            return Math.sin(p * 0.25) * 0.5 + 0.5;
        }

        function calcPosition(x, y, ratio) {
            const dx = x - CX;
            const dy = y - CY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const force = 1 / Math.pow(dist + 0.1, 0.5);
            const nx = ratio * force * dx * 0.5 + (Math.random() - 0.5) * 1.5;
            const ny = ratio * force * dy * 0.5 + (Math.random() - 0.5) * 1.5;
            return { x: Math.round(x - nx), y: Math.round(y - ny) };
        }

        class Heart {
            constructor() {
                this._points = [];
                this._edgeDiffusionPoints = [];
                this._centerDiffusionPoints = [];
                this.generateFrame = GENERATE_FRAME;
                this.build(4000);
            }

            build(number) {
                const pointSet = new Set();
                let attempts = 0;
                while (this._points.length < number && attempts < number * 3) {
                    const t = Math.random() * 2 * Math.PI;
                    const p = heartFunction(t);
                    const key = p.x + ',' + p.y;
                    if (!pointSet.has(key)) {
                        pointSet.add(key);
                        this._points.push(p);
                    }
                    attempts++;
                }

                for (const p of this._points) {
                    for (let j = 0; j < 3; j++) {
                        const sp = scatterInside(p.x, p.y, 0.05);
                        this._edgeDiffusionPoints.push(sp);
                    }
                }

                const pointList = [...this._points];
                for (let i = 0; i < 6000; i++) {
                    const idx = Math.floor(Math.random() * pointList.length);
                    const chosen = pointList[idx];
                    const sp = scatterInside(chosen.x, chosen.y, 0.17);
                    this._centerDiffusionPoints.push(sp);
                }
            }

            calc(frame) {
                const frameRatio = frame / 12 * Math.PI;
                const ratio = 8 * curve(frameRatio);

                const allPoints = [];

                for (const p of this._points) {
                    const np = calcPosition(p.x, p.y, ratio);
                    const size = Math.floor(Math.random() * 3) + 1;
                    allPoints.push({ x: np.x, y: np.y, size: size });
                }

                for (const p of this._edgeDiffusionPoints) {
                    const np = calcPosition(p.x, p.y, ratio);
                    const size = Math.floor(Math.random() * 2) + 1;
                    allPoints.push({ x: np.x, y: np.y, size: size });
                }

                for (const p of this._centerDiffusionPoints) {
                    const np = calcPosition(p.x, p.y, ratio);
                    const size = Math.floor(Math.random() * 2) + 1;
                    allPoints.push({ x: np.x, y: np.y, size: size });
                }

                return allPoints;
            }

            render(ctx, frame) {
                const points = this.calc(frame % this.generateFrame);

                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                for (const p of points) {
                    const color = Math.random() > 0.6 ? HEART_COLOR_LIGHT : HEART_COLOR;
                    ctx.fillStyle = color;
                    const s = p.size;
                    ctx.fillRect(p.x, p.y, s, s);
                }

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const fontSize = Math.min(CANVAS_SIZE / 16, 40);
                ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", Arial, sans-serif`;
                ctx.fillStyle = '#FF69B4';
                ctx.shadowColor = 'rgba(255,105,180,0.3)';
                ctx.shadowBlur = 20;
                ctx.fillText('💗 阿瑟同款 💗', CX, CY - CANVAS_SIZE * 0.35);

                const subFontSize = Math.min(CANVAS_SIZE / 28, 22);
                ctx.font = `italic ${subFontSize}px Arial, sans-serif`;
                ctx.fillStyle = '#FFB6C1';
                ctx.shadowBlur = 12;
                ctx.fillText('✨ You are my heartbeat ✨', CX, CY - CANVAS_SIZE * 0.27);

                ctx.shadowBlur = 0;
            }
        }

        let heart = new Heart();

        let frameCounter = 0;
        let lastTimestamp = 0;

        function animate(timestamp) {
            if (timestamp - lastTimestamp < 40) {
                requestAnimationFrame(animate);
                return;
            }
            lastTimestamp = timestamp;

            heart.render(ctx, frameCounter);
            frameCounter = (frameCounter + 1) % GENERATE_FRAME;

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            const newSize = resizeCanvas();
            if (newSize !== CANVAS_SIZE) {
                CANVAS_SIZE = newSize;
                CX = CANVAS_SIZE / 2;
                CY = CANVAS_SIZE / 2;
                heart = new Heart();
                frameCounter = 0;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                frameCounter = 0;
            }
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
